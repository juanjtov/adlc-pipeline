# ADLC fix loop — closes the review → fix → re-review cycle so the human only reads + merges.
# Triggers when the review lane labels a PR `adlc:changes-requested`. It re-invokes the Builder
# to fix the findings on the SAME branch; the push re-runs the review lane, which re-labels if
# still not clean — so the loop repeats until both reviews PASS, then the PR waits for your merge.
# Capped: after 3 fix rounds it stops and tags `needs:human` instead of fixing again. A round is
# a review that sent this PR back, counted from the PR's own label events and verdict comments
# (adlc-rounds.sh), not from its commits.
#
# It removes the label before fixing so the review lane can re-add it (a re-add is what fires the
# next round). PREREQUISITES: CLAUDE_CODE_OAUTH_TOKEN + ADLC_DISPATCH_TOKEN. The agent step
# installs the plugin and runs as `adlc:builder` (see adlc-builder.yml, HOW THE AGENT RUNS).
name: ADLC fix loop

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    if: >
      github.event.label.name == 'adlc:changes-requested' &&
      contains(fromJSON('["{{PRINCIPAL}}","{{BUILDER_BOT}}"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the Builder can compare its branch with the base
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.ADLC_DISPATCH_TOKEN }}

      - name: Loop cap (count this PR's fix rounds)
        id: cap
        env:
          GH_TOKEN: ${{ github.token }}   # two reads (the PR's timeline and comments); no write
          PR: ${{ github.event.pull_request.number }}
        run: |
          chmod +x .adlc/scripts/adlc-fix-cap.sh
          # Count the fix rounds of THIS PR: the reviews that sent it back, read from its own
          # `adlc:changes-requested` label events and CHANGES verdict comments (adlc-rounds.sh),
          # the label that started this run included. GO for the first 3, STOP from the 4th.
          # Nothing is read from the commits: a Builder makes several per round, and a branch can
          # carry another PR's fix commits (a stacked PR whose parent was squash-merged, a
          # promotion PR). A plain assignment: a count that cannot be read fails the script, and
          # that must fail the step, never read as GO.
          d=$(.adlc/scripts/adlc-fix-cap.sh --pr "$PR" 3)
          echo "decision=$d"
          case "$d" in
            STOP) echo "stop=true" >> "$GITHUB_OUTPUT" ;;
            GO)   echo "stop=false" >> "$GITHUB_OUTPUT" ;;
            *)    echo "::error::The fix-loop cap gave no decision"; exit 1 ;;
          esac

      # Only when the cap step itself failed (not when an earlier step did): a red run in the
      # Actions tab is easy to miss, and the PR would otherwise wait with the label on and no word.
      - name: Say that the cap could not run
        if: failure() && steps.cap.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "⚠️ The fix-loop cap could not count this PR's fix rounds, so the Builder did not run. Nothing changed: the PR keeps \`adlc:changes-requested\`. Fix the cause, then re-run the failed job: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Escalate to a human (cap reached)
        if: steps.cap.outputs.stop == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "⚠️ ADLC fix loop: 3 fix rounds and the review still asks for changes — escalating. The Builder will not auto-fix again on this PR."
          gh pr edit "$PR" --add-label "needs:human" --remove-label "adlc:changes-requested" || true

      - name: Clear the flag so the re-review can re-fire the loop
        if: steps.cap.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label "adlc:changes-requested" || true

      - name: Builder addresses the review
        if: steps.cap.outputs.stop == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          allowed_bots: "{{BUILDER_BOT}}"
          plugin_marketplaces: "https://github.com/juanjtov/adlc-pipeline.git"
          plugins: "adlc@adlc-pipeline"
          claude_args: |
            --agent adlc:builder
            --permission-mode dontAsk
            --allowedTools "Read,Edit,Write,Skill,Bash"
          prompt: |
            PR #${{ github.event.pull_request.number }} was labelled adlc:changes-requested. Load
            your role's skills with the Skill tool first: adlc:role-builder, then the rest your
            agent file lists. Read the architect + adversarial review
            comments on the PR, fix the issues WITHIN the declared diff scope, keep the AC-traced
            tests green, commit with a message starting `adlc-fix:` and push to the same branch.
            Do not merge, do not change labels — the push re-runs the review lane.
