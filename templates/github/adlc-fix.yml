# ADLC fix loop — closes the review → fix → re-review cycle so the human only reads + merges.
# Triggers when the review lane labels a PR `adlc:changes-requested`. It re-invokes the Builder
# to fix the findings on the SAME branch; the push re-runs the review lane, which re-labels if
# still not clean — so the loop repeats until both reviews PASS, then the PR waits for your merge.
# Capped: after 3 fix rounds it stops and tags `needs:human` instead of fixing again.
#
# It removes the label before fixing so the review lane can re-add it (a re-add is what fires the
# next round). PREREQUISITES: CLAUDE_CODE_OAUTH_TOKEN + ADLC_DISPATCH_TOKEN.
name: ADLC fix loop

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  fix:
    if: >
      github.event.label.name == 'adlc:changes-requested' &&
      contains(fromJSON('["{{PRINCIPAL}}","{{BUILDER_BOT}}"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.ADLC_DISPATCH_TOKEN }}

      - name: Loop cap (count prior fix rounds)
        id: cap
        run: |
          chmod +x .adlc/scripts/adlc-fix-cap.sh
          d=$(git log --format='%s' | .adlc/scripts/adlc-fix-cap.sh 3)
          echo "decision=$d"
          if [ "$d" = "STOP" ]; then echo "stop=true" >> "$GITHUB_OUTPUT"; else echo "stop=false" >> "$GITHUB_OUTPUT"; fi

      - name: Escalate to a human (cap reached)
        if: steps.cap.outputs.stop == 'true'
        env:
          GH_TOKEN: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "⚠️ ADLC fix loop hit 3 rounds without passing — escalating. The Builder will not auto-fix again on this PR."
          gh pr edit "$PR" --add-label "needs:human" --remove-label "adlc:changes-requested" || true

      - name: Clear the flag so the re-review can re-fire the loop
        if: steps.cap.outputs.stop == 'false'
        env:
          GH_TOKEN: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --remove-label "adlc:changes-requested" || true

      - name: Builder addresses the review
        if: steps.cap.outputs.stop == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          prompt: |
            You are the ADLC Builder. PR #${{ github.event.pull_request.number }} was labelled
            adlc:changes-requested. Read the architect + adversarial review comments on the PR, fix
            the issues WITHIN the declared diff scope, keep the AC-traced tests green, commit with a
            message starting `adlc-fix:` and push to the same branch. Load the builder agent
            definition + project-conventions + adlc:security-gate. Do not merge, do not change labels
            — the push re-runs the review lane.
