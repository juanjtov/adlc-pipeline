# ADLC intake (AUTO-START) — the "prompt a requirement and the pipeline starts" option.
# Fires when a requirement issue is opened (or gets the `adlc:auto` label) by an allowlisted
# author, and runs the Product Analyst immediately: it posts stories + testable ACs and moves
# the issue to `gate:stories` — where it STOPS for your Gate 1 approval (human, by design).
#
# SAFETY: gated to the Principal/allowlist AND the `adlc:auto` label, so a stranger's issue —
# or a bug/question — never auto-starts an autonomous run. File via the "Requirement (ADLC
# autopilot)" issue template (it applies `adlc:auto`) to start instantly.
name: ADLC intake (auto-start)

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: read
  issues: write

# De-dupe if both the opened+labeled events land for one issue.
concurrency:
  group: adlc-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    if: >
      contains(github.event.issue.labels.*.name, 'adlc:auto') &&
      contains(fromJSON('["{{PRINCIPAL}}"]'), github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Product Analyst
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          prompt: |
            You are the ADLC Product Analyst. Triage issue #${{ github.event.issue.number }} and
            turn it into stories (or a change brief). Load the product-analyst agent definition and
            the triage + project-conventions + adlc:edd-spec skills. Do the Step-0 completeness
            check FIRST — if the requirement is ambiguous or malformed, post numbered clarifying
            questions and STOP. Otherwise triage (emit an `ADLC-TRIAGE: FAST|FULL` verdict line),
            post the story set (FULL) or the change brief (FAST), and move the issue to
            gate:stories. Never apply a stage:* label (routing past Gate 1 is the human's / autopilot's).

      # FULL AUTOPILOT only: issues labelled adlc:autopilot auto-approve Gate 1 so the FULL pipeline
      # runs to a QA-approved PR and the ONLY human step is Gate 2 (merge/deploy). The agent never
      # does this — the Principal opts in per-issue via the label, and the workflow acts.
      #
      # LANE CHOICE IS ALWAYS THE HUMAN'S. Autopilot never STARTS the fast lane: the fast lane skips
      # design + Gate 1, so taking it is an explicit human approval, even under autopilot. On a FAST
      # recommendation the workflow PAUSES at gate:stories and waits for the Principal to apply
      # stage:fast (approve the fast lane) or stage:design (take the full pipeline). On FULL it
      # auto-approves Gate 1 into the full pipeline as before — nothing safety-relevant is skipped there.
      - name: Auto-advance Gate 1 — full lane only (fast lane waits for human approval)
        if: contains(github.event.issue.labels.*.name, 'adlc:autopilot')
        env:
          GH_TOKEN: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          N: ${{ github.event.issue.number }}
        run: |
          # Advance only if the Analyst actually finished (reached gate:stories); if it stopped at
          # Step 0 for clarifying questions, the issue stays at stage:intake.
          labels=$(gh issue view "$N" --json labels --jq '.labels[].name')
          if ! echo "$labels" | grep -qx 'gate:stories'; then
            echo "Analyst paused for clarification — not auto-advancing."; exit 0
          fi
          # Read the last triage verdict from the Analyst's comments (deterministic parse).
          # `|| true`: with no marker the grep exits 1, and the step's `set -eo pipefail` would
          # otherwise abort here — stalling the issue at gate:stories. Same guard as adlc-verdict.sh.
          triage=$(gh issue view "$N" --json comments --jq '.comments[].body' \
            | grep -oE 'ADLC-TRIAGE:[[:space:]]*(FAST|FULL)' | grep -oE '(FAST|FULL)' | tail -1 || true)
          if [ "$triage" = "FAST" ]; then
            # Do NOT start the fast lane. Leave it at gate:stories for the human to approve the lane.
            gh issue comment "$N" --body "🚦 Triaged **FAST** — the fast lane is *recommended*. It skips design + Gate 1, so the **lane is yours to approve**: apply \`stage:fast\` to take it, or \`stage:design\` for the full pipeline. Autopilot will not start the fast lane on its own."
            echo "Autopilot: triaged FAST → left at gate:stories for human lane approval (fast lane never auto-starts)."
          else
            gh issue edit "$N" --remove-label gate:stories --add-label stage:design
            echo "Autopilot: triaged FULL → Gate 1 auto-approved → stage:design. Gate 2 remains the only human step."
          fi
