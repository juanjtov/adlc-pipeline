# ADLC retro — the scheduled half of the self-improvement loop.
# Runs the retro on a cadence: reads the metrics + finding ledger, and opens a PROPOSAL PR
# with durable fixes (regression tests / checks / conventions) + context pruning. It NEVER
# auto-applies — the PR goes through the normal gates (QA + adversarial review).
#
# PREREQUISITES: CLAUDE_CODE_OAUTH_TOKEN + ADLC_DISPATCH_TOKEN (the dispatch token so the
# proposal PR is bot-authored and can trigger the review/CI lanes). Also add `jq` if your
# metrics script needs it (ubuntu-latest has it).
# The step installs the plugin and invokes its `retro` skill by name (`/adlc:retro`), with the
# tools the skill needs (see adlc-builder.yml, HOW THE AGENT RUNS).
name: ADLC retro

on:
  schedule:
    - cron: "0 15 * * 1"   # Mondays 15:00 UTC — adjust cadence to taste
  workflow_dispatch: {}     # allow a manual run from the Actions tab

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  retro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run the retro (opens a proposal PR)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          allowed_bots: "{{BUILDER_BOT}}"
          plugin_marketplaces: "https://github.com/juanjtov/adlc-pipeline.git"
          plugins: "adlc@adlc-pipeline"
          claude_args: |
            --permission-mode dontAsk
            --allowedTools "Read,Edit,Write,Skill,Bash"
          prompt: "/adlc:retro"
