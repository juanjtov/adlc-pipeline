# ADLC main-branch tripwire — the Free-plan substitute for branch protection on PRIVATE repos.
# On every push to main it FAILS (and opens an alert issue) if a pushed commit didn't arrive
# through a merged PR — i.e. someone pushed straight to main, bypassing the QA gate + Gate 2.
# The decision is `.adlc/scripts/adlc-tripwire-check.sh` (unit-tested); this workflow just
# resolves each commit's PR association via `gh api` and pipes it in.
# On a PUBLIC repo use real branch protection instead. Enforcement of record is still the
# `.claude/settings.json` deny rules; this catches a HUMAN pushing by hand, after the fact.
name: ADLC main tripwire

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  detect-direct-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Flag commits not linked to a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          chmod +x .adlc/scripts/adlc-tripwire-check.sh
          # New-branch pushes report an all-zero "before"; scope to the new commit then.
          if [ -z "${BEFORE//0/}" ]; then range="$AFTER -n 1"; else range="$BEFORE..$AFTER"; fi

          # Build "<sha> <pr_count>" lines for each non-merge commit, then let the script decide.
          lines=$(for sha in $(git rev-list --no-merges $range 2>/dev/null); do
                    n=$(gh api "repos/$REPO/commits/$sha/pulls" --jq 'length' 2>/dev/null || echo 0)
                    echo "$sha $n"
                  done)
          result=$(printf '%s\n' "$lines" | .adlc/scripts/adlc-tripwire-check.sh) || {
            shas=${result#DIRECT:}
            echo "::error::Direct push to main detected (bypassed the QA gate):$shas"
            gh issue create \
              --title "⚠️ Direct push to main — bypassed the QA gate" \
              --label "bug" \
              --body "These commits reached \`main\` with no associated merged PR:$shas

          Gate 2 requires merges go through the QA gate and Principal approval. If unintended,
          revert and re-land through a PR. (ADLC tripwire — the Free-plan stand-in for branch protection.)"
            exit 1
          }
          echo "$result"
