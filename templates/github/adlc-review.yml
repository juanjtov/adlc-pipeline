# ADLC review lane — runs BOTH independent reviews on each Builder PR (adversarial first, then
# architect conformance), then decides the build → qa handoff FROM THE AGENTS' VERDICTS, not
# from GitHub's aggregate review decision. Why:
#   * You can safely enable branch protection "require a human approval" — it then gates ONLY the
#     final MERGE, while the pipeline still flows to a finished, QA'd PR.
#   * Identity-safe: a bot can't formally approve/request-changes on its own PR, so control never
#     depends on GitHub review state. Each agent ends its comment with a PASS/CHANGES marker and
#     the workflow reads it. On CHANGES the PR is labelled `adlc:changes-requested` → the fix loop.
#
# PREREQUISITES: CLAUDE_CODE_OAUTH_TOKEN + ADLC_DISPATCH_TOKEN. Fill the {{PRINCIPAL}} /
# {{BUILDER_BOT}} allowlist (the accounts whose PRs may be auto-reviewed).
name: ADLC review

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # Fast-lane PRs are owned by adlc-fast.yml — the full lane must defer, or it double-advances the
  # issue. The PR's own `lane:fast` label is unreliable at `opened` (the Builder adds it in a
  # second api call, after the PR is created), so route off the LINKED ISSUE's stage:fast, which
  # is set before the PR exists. Belt-and-suspenders: also honor the PR label when it is present.
  route:
    if: contains(fromJSON('["{{PRINCIPAL}}","{{BUILDER_BOT}}"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    outputs:
      fast: ${{ steps.check.outputs.fast }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          fast=false
          pr_has=${{ contains(github.event.pull_request.labels.*.name, 'lane:fast') }}
          [ "$pr_has" = "true" ] && fast=true
          issue=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
          [ -z "$issue" ] && issue=$(gh pr view "$PR" --json body --jq '.body' | grep -oiE '#[0-9]+' | head -1 | tr -d '#' || true)
          if [ -n "$issue" ]; then
            if gh issue view "$issue" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx 'stage:fast'; then
              fast=true
            fi
          fi
          echo "fast=$fast" >> "$GITHUB_OUTPUT"
          echo "fast-lane PR? $fast (issue #$issue)"

  adversarial:
    needs: route
    if: >
      needs.route.outputs.fast != 'true' &&
      contains(fromJSON('["{{PRINCIPAL}}","{{BUILDER_BOT}}"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Adversarial review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          prompt: |
            You are the ADLC adversarial-reviewer. Review PR #${{ github.event.pull_request.number }}
            in fresh context, read-only, seeing ONLY the diff + the linked ADR/task breakdown/ACs.
            Load the adversarial-reviewer agent definition + adlc:code-review + project-conventions
            + adlc:security-gate. Apply the three pillars. Post findings as ONE PR comment whose
            LAST line is exactly `ADLC-ADV: PASS` (nothing blocking) or `ADLC-ADV: CHANGES` (a
            confirmed Critical/High). Never edit code, never merge, never change labels.

  architect:
    needs: [route, adversarial]
    if: >
      needs.route.outputs.fast != 'true' &&
      contains(fromJSON('["{{PRINCIPAL}}","{{BUILDER_BOT}}"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Architect conformance review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          prompt: |
            You are the ADLC Architect (review duty). Review PR #${{ github.event.pull_request.number }}
            for declared-diff-scope + design conformance vs the ADR/task breakdown, and also read the
            adversarial-reviewer's latest findings comment. Load the architect agent definition +
            project-conventions. Post ONE comment whose LAST line is exactly `ADLC-ARCH: PASS` or
            `ADLC-ARCH: CHANGES`. Do NOT change labels — the next step does.

      - name: Advance or flag (from both verdicts)
        env:
          GH_TOKEN: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          chmod +x .adlc/scripts/adlc-verdict.sh
          bodies=$(gh pr view "$PR" --json comments --jq '.comments[].body')
          adv=$(printf '%s\n' "$bodies" | .adlc/scripts/adlc-verdict.sh ADLC-ADV)
          arch=$(printf '%s\n' "$bodies" | .adlc/scripts/adlc-verdict.sh ADLC-ARCH)
          echo "adversarial=$adv architect=$arch"
          if [ "$adv" = "PASS" ] && [ "$arch" = "PASS" ]; then
            issue=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
            [ -z "$issue" ] && issue=$(gh pr view "$PR" --json body --jq '.body' | grep -oiE '#[0-9]+' | head -1 | tr -d '#')
            gh pr edit "$PR" --remove-label "adlc:changes-requested" 2>/dev/null || true
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --remove-label stage:build --add-label stage:qa
              echo "Both reviews PASS → issue #$issue advanced to stage:qa (QA lane fires)."
            fi
          else
            gh pr edit "$PR" --add-label "adlc:changes-requested"
            echo "Not clean (adv=$adv arch=$arch) → labelled adlc:changes-requested (fix loop runs)."
          fi
