# ADLC diff guards — the path-level half of author/verifier separation, and the fast-lane cap.
# Fails a lane PR whose changed files fall outside the scope its issue declares, and a fast-lane
# PR that is over the cap. The decisions are unit-tested scripts:
#   .adlc/scripts/adlc-pr-stage.sh    WHICH stage — read from the PR's LINKED ISSUE, because the
#                                     lanes put stage:* on the issue and never on the PR. The
#                                     PR's own `lane:fast` / stage:* labels are the fallback.
#   .adlc/scripts/adlc-diff-scope.sh  the scope check — build|fast → .adlc/scope/<issue>.txt,
#                                     which the Builder writes · build+qa (issue at stage:qa) →
#                                     that scope + $ADLC_TEST_DIRS · no lane stage → skipped.
#   .adlc/scripts/adlc-triage.sh      the fast-lane cap (size, sensitive paths, submodules),
#                                     fast PRs only.
# A PR is tied to its issue by a closing reference (`Closes #N`), by its branch name
# (feat/<issue>-<slug>), or — when the Builder opened it — by the same rule the lanes use to
# link it. Tied to an open lane issue and declaring no scope, it FAILS.
#
# TRUST: this runs on `pull_request_target`, so the workflow and the scripts are the DEFAULT
# branch's — a PR cannot edit the guards that judge it (on `pull_request` it could: GitHub then
# runs the PR's own copy of both). The PR's content is only READ, as data: its file list, its
# scope file, its diff. Never add a checkout of the PR head here, and never run anything from it.
name: ADLC diff-scope

on:
  pull_request_target:
    # labeled/unlabeled: the Builder adds lane:fast after the PR opens, and a bounce removes it.
    # edited: a body edit can add the closing reference, and a retarget changes what the cap is
    # measured against. The job has NO `if:` on purpose — a skipped job reports as a pass, so
    # any later label (adlc:changes-requested, needs:human) would wipe out a failed verdict.
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read        # the PR's scope file and diff
  issues: read          # the stage label is on the linked issue
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5              # the scope file and the diff are the PR's to size
    steps:
      - uses: actions/checkout@v4   # the DEFAULT branch (what pull_request_target checks out)
        with:
          fetch-depth: 0            # the cap diffs the PR against its merge base
      - name: Enforce declared diff scope and the fast-lane cap
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BUILDER_BOT: "{{BUILDER_BOT}}"
          # test dirs QA may write (regex alternation), e.g. tests|backend/tests
          ADLC_TEST_DIRS: "{{TEST_DIR_REGEX}}"
          # Fast-lane cap overrides. If you tune them, set the same values in adlc-fast.yml:
          # ADLC_FAST_MAX_FILES: "5"
          # ADLC_FAST_MAX_LINES: "40"
        run: |
          chmod +x .adlc/scripts/adlc-pr-stage.sh .adlc/scripts/adlc-branch-issue.sh .adlc/scripts/adlc-diff-scope.sh .adlc/scripts/adlc-triage.sh
          err=$(mktemp)
          # Plain assignments, never a pipe from gh or git: a failed call must fail the check, not
          # skip it. The files API (not `gh pr diff`) has no 300-file limit and no quoted names;
          # a rename counts under both its old and its new path.
          pr_labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          files=$(gh api --paginate "repos/{owner}/{repo}/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
          # Which issue. Candidates, in order. For the Builder's own PRs, first the issue the lanes
          # resolve, by the lanes' own rule (adlc-review.yml, adlc-fast.yml: the first closing
          # reference of ANY repo, else the first `#N` in the body, an HTML entity like `&#12;`
          # included) — copied as it is and tried first, so that the issue a lane advances is the
          # one this check judges. For anyone else that rule is not used: a bare `#N` is often an
          # upstream PR number. Then a closing reference in THIS repo, then the issue the head
          # branch names. The first candidate that is an OPEN issue at a lane stage wins: no
          # single signal can point this check away from an issue a lane will advance. (A closed
          # issue keeps its old stage labels, so only an open one counts.)
          here=$(gh pr view "$PR" --json url,closingIssuesReferences --jq '.url as $u | [.closingIssuesReferences[] | select(.url | startswith(($u | sub("/pull/[0-9]+$"; "")) + "/issues/"))][0].number // empty')
          lane=""
          if [ "$AUTHOR" = "$BUILDER_BOT" ]; then
            lane=$(gh pr view "$PR" --json closingIssuesReferences,body --jq '(.closingIssuesReferences[0].number // empty | "#\(.)"), .body')
            # `|| true`: with `shell: bash` (pipefail) a body with no `#N` must read as no link
            lane=$(printf '%s\n' "$lane" | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          fi
          cands="$lane $here $(.adlc/scripts/adlc-branch-issue.sh "$HEAD_REF")"
          issue=""; issue_labels=""
          for n in $cands; do
            if labels=$(gh api "repos/{owner}/{repo}/issues/$n" --jq 'select(.state == "open") | .labels[].name' 2>"$err"); then
              [ -n "$issue" ] || issue="$n"   # with no lane issue, the first real one names the scope file
              if [ "$(.adlc/scripts/adlc-pr-stage.sh "" "$labels")" != other ]; then issue="$n"; issue_labels="$labels"; break; fi
            else
              # Not an issue here (404): try the next candidate. Anything else is an API error
              # and fails the check.
              grep -q 'HTTP 404' "$err" || { cat "$err" >&2; exit 1; }
            fi
          done
          stage=$(.adlc/scripts/adlc-pr-stage.sh "$pr_labels" "$issue_labels")
          echo "stage=$stage (issue: #${issue:-none})"
          rc=0

          # The file list above stops at 3000 entries: GitHub serves no more. A lane PR beyond
          # that cannot be held to a scope, so it fails rather than pass on the files listed.
          if [ "$stage" != other ]; then
            nfiles=$(gh pr view "$PR" --json changedFiles --jq '.changedFiles')
            [ "$nfiles" -le 3000 ] || { echo "this PR changes $nfiles files; GitHub lists at most 3000 of them, so it cannot be held to a scope — split it" >&2; exit 1; }
          fi

          # The PR's head and its base branch, fetched by name, as DATA: nothing from them is
          # checked out or run. Full ref names: a tag called `origin/<base>` must not stand in
          # for the base branch, which need not be the default branch this job checked out.
          if [ "$stage" != other ]; then
            git fetch -q --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" "+refs/pull/$PR/head:refs/remotes/pr/head"
          fi

          # Scope. The scope file is read from the PR's current head — the same commit the file
          # list above and the cap below describe — with git, as the blob at that path. (The
          # contents API follows a link: a PR could point its scope file at any file on its branch
          # and be held to text its diff never shows.) Only a plain file counts; a link, a
          # directory or a submodule at that path fails the check, as does a link at `.adlc` or
          # `.adlc/scope`, and the message says which. A branch that does not contain the file
          # declares no scope, even if the default branch has one for that issue. The directory
          # is made fresh for that reason, and so that a link planted in it on the default
          # branch cannot turn this write into a write to another file (a guard script).
          rm -rf .adlc/scope; mkdir -p .adlc/scope
          scope="${issue:+.adlc/scope/$issue.txt}"
          if [ -n "$scope" ] && [ "$stage" != other ]; then
            entry=$(git ls-tree refs/remotes/pr/head -- "$scope")   # <mode> <type> <object>\t<path>, or nothing
            [ -n "$entry" ] || entry=$(git ls-tree refs/remotes/pr/head -- .adlc .adlc/scope | grep '^120000 ' || true)
            case "$entry" in
              "") ;;                                                      # no scope file: the script says so
              "100644 blob "*|"100755 blob "*) git cat-file blob "refs/remotes/pr/head:$scope" > "$scope" ;;
              *) echo "$(printf '%s\n' "$entry" | cut -f2) on this PR is not a plain file (git mode ${entry%% *}): the scope file must be the declaration itself, not a link to one" >&2; exit 1 ;;
            esac
          fi
          printf '%s\n' "$files" | .adlc/scripts/adlc-diff-scope.sh "$stage" "$scope" || rc=1

          # Fast-lane cap. adlc-fast.yml runs the same cap to route an over-cap PR to the full
          # pipeline, but from the PR's own checkout; this copy is the one a PR cannot edit.
          # --raw: the mode of each entry, so the script can tell a submodule (a gitlink, mode
          # 160000) from a one-line file. --ignore-submodules=none: the diff reads THIS checkout's
          # .gitmodules — the default branch's — and a repo whose own file says `ignore = all`
          # would otherwise have every submodule change left out of what the cap sees.
          if [ "$stage" = fast ]; then
            base=$(git merge-base "refs/remotes/origin/$BASE_REF" refs/remotes/pr/head)
            entries=$(git -c core.quotePath=false diff --numstat --no-renames --raw --ignore-submodules=none "$base" refs/remotes/pr/head)
            printf '%s\n' "$entries" | .adlc/scripts/adlc-triage.sh || rc=1
          fi
          exit "$rc"
