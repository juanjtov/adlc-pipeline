# ADLC diff guards — the path-level half of author/verifier separation, and the fast-lane cap.
# Fails a lane PR whose changed files fall outside the scope its issue declares, and a fast-lane
# PR that is over the cap. The decisions are unit-tested scripts:
#   .adlc/scripts/adlc-pr-stage.sh    WHICH stage — read from the PR's LINKED ISSUE, because the
#                                     lanes put stage:* on the issue and never on the PR. The
#                                     PR's own `lane:fast` / stage:* labels are the fallback.
#   .adlc/scripts/adlc-diff-scope.sh  the scope check — build|fast → .adlc/scope/<issue>.txt,
#                                     which the Builder writes · build+qa (issue at stage:qa) →
#                                     that scope + $ADLC_TEST_DIRS · no lane stage → skipped.
#   .adlc/scripts/adlc-triage.sh      the fast-lane cap (size + sensitive paths), fast PRs only.
# A PR is tied to its issue by a closing reference (`Closes #N`) or by its branch name
# (feat/<issue>-<slug>). Tied to an open lane issue and declaring no scope, it FAILS.
#
# TRUST: this runs on `pull_request_target`, so the workflow and the scripts are the DEFAULT
# branch's — a PR cannot edit the guards that judge it (on `pull_request` it could: GitHub then
# runs the PR's own copy of both). The PR's content is only READ, as data: its file list, its
# scope file, its diff. Never add a checkout of the PR head here, and never run anything from it.
name: ADLC diff-scope

on:
  pull_request_target:
    # labeled: the Builder adds lane:fast after the PR opens. edited: a body edit can add the
    # closing reference, and a retarget changes what the cap is measured against.
    types: [opened, synchronize, reopened, labeled, edited]

permissions:
  contents: read        # the PR's scope file and diff
  issues: read          # the stage label is on the linked issue
  pull-requests: read

jobs:
  scope:
    # On a label change, only a label that can change the stage is worth a run.
    if: >
      github.event.action != 'labeled' ||
      github.event.label.name == 'lane:fast' ||
      startsWith(github.event.label.name, 'stage:')
    runs-on: ubuntu-latest
    timeout-minutes: 5              # the scope file and the diff are the PR's to size
    steps:
      - uses: actions/checkout@v4   # the DEFAULT branch (what pull_request_target checks out)
        with:
          fetch-depth: 0            # the cap diffs the PR against its merge base
      - name: Enforce declared diff scope and the fast-lane cap
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BUILDER_BOT: "{{BUILDER_BOT}}"
          # test dirs QA may write (regex alternation), e.g. tests|backend/tests
          ADLC_TEST_DIRS: "{{TEST_DIR_REGEX}}"
          # Fast-lane cap overrides. If you tune them, set the same values in adlc-fast.yml:
          # ADLC_FAST_MAX_FILES: "5"
          # ADLC_FAST_MAX_LINES: "40"
        run: |
          chmod +x .adlc/scripts/adlc-pr-stage.sh .adlc/scripts/adlc-branch-issue.sh .adlc/scripts/adlc-diff-scope.sh .adlc/scripts/adlc-triage.sh
          err=$(mktemp)
          # Plain assignments, never a pipe from gh or git: a failed call must fail the check, not
          # skip it. The files API (not `gh pr diff`) has no 300-file limit and no quoted names;
          # a rename counts under both its old and its new path.
          pr_labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          files=$(gh api --paginate "repos/{owner}/{repo}/pulls/$PR/files?per_page=100" --jq '.[] | .filename, (.previous_filename // empty)')
          # Which issue: a closing reference in THIS repo, else the one the head branch names. For
          # the Builder's own PRs the first `#N` in the body also counts, because the lanes link
          # them that way: whatever a lane can advance, this check can judge. For anyone else's
          # PR a bare `#N` is not used — it is often an upstream PR number or an HTML entity.
          issue=$(gh pr view "$PR" --json url,closingIssuesReferences --jq '.url as $u | [.closingIssuesReferences[] | select(.url | startswith(($u | sub("/pull/[0-9]+$"; "")) + "/issues/"))][0].number // empty')
          if [ -z "$issue" ]; then issue=$(.adlc/scripts/adlc-branch-issue.sh "$HEAD_REF"); fi
          if [ -z "$issue" ] && [ "$AUTHOR" = "$BUILDER_BOT" ]; then
            body=$(gh pr view "$PR" --json body --jq '.body')
            issue=$(printf '%s\n' "$body" | sed 's/&#[0-9]*;//g' | grep -oE '#[0-9]+' | head -1 | tr -d '#' || true)
          fi
          issue_labels=""
          if [ -n "$issue" ]; then
            # Only an OPEN issue is in a lane; a closed one keeps its old stage labels.
            if ! issue_labels=$(gh api "repos/{owner}/{repo}/issues/$issue" --jq 'select(.state == "open") | .labels[].name' 2>"$err"); then
              # A number that is no issue here (404) ties the PR to none. Any other failure is
              # an API error and fails the check.
              grep -q 'HTTP 404' "$err" || { cat "$err" >&2; exit 1; }
              issue=""; issue_labels=""
            fi
          fi
          stage=$(.adlc/scripts/adlc-pr-stage.sh "$pr_labels" "$issue_labels")
          echo "stage=$stage (issue: #${issue:-none})"
          rc=0

          # Scope. The scope file is read, as data, from the PR's current head — the same commit
          # the file list above and the cap below describe. A branch that does not contain it
          # declares no scope, even if the default branch has one for that issue.
          scope="${issue:+.adlc/scope/$issue.txt}"
          if [ -n "$scope" ] && [ "$stage" != other ]; then
            mkdir -p .adlc/scope
            if ! gh api "repos/{owner}/{repo}/contents/$scope?ref=refs/pull/$PR/head" -H "Accept: application/vnd.github.raw" > "$scope" 2>"$err"; then
              rm -f "$scope"
              grep -q 'HTTP 404' "$err" || { cat "$err" >&2; exit 1; }
            fi
          fi
          printf '%s\n' "$files" | .adlc/scripts/adlc-diff-scope.sh "$stage" "$scope" || rc=1

          # Fast-lane cap. adlc-fast.yml runs the same cap to route an over-cap PR to the full
          # pipeline, but from the PR's own checkout; this copy is the one a PR cannot edit.
          # Full ref names: a tag called `origin/<base>` must not stand in for the base branch.
          if [ "$stage" = fast ]; then
            git fetch -q --no-tags origin "+refs/pull/$PR/head:refs/remotes/pr/head"
            base=$(git merge-base "refs/remotes/origin/$BASE_REF" refs/remotes/pr/head)
            numstat=$(git -c core.quotePath=false diff --numstat --no-renames "$base" refs/remotes/pr/head)
            printf '%s\n' "$numstat" | .adlc/scripts/adlc-triage.sh || rc=1
          fi
          exit "$rc"
