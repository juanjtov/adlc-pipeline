# ADLC diff-scope check — the path-level half of author/verifier separation.
# Fails a PR whose changed files fall outside the scope allowed for its stage. The actual
# check is `.adlc/scripts/adlc-diff-scope.sh` (shared with the local pre-commit hook and unit-
# tested), so CI and local enforce identically:
#   stage:design → docs/ only · stage:qa → $ADLC_TEST_DIRS · stage:build → .adlc/scope.txt globs
#   (if the Architect wrote one; otherwise advisory, enforced by the review).
name: ADLC diff-scope

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce declared diff scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # test dirs allowed for qa-stage PRs (regex alternation), e.g. tests|backend/tests
          ADLC_TEST_DIRS: "{{TEST_DIR_REGEX}}"
        run: |
          chmod +x .adlc/scripts/adlc-diff-scope.sh
          labels=$(gh pr view "$PR" --json labels --jq '.labels[].name' | tr '\n' ' ')
          stage=other
          case "$labels" in
            *stage:design*) stage=design ;;
            *stage:qa*)     stage=qa ;;
            *stage:build*)  stage=build ;;
          esac
          echo "stage=$stage"
          gh pr diff "$PR" --name-only | .adlc/scripts/adlc-diff-scope.sh "$stage"
