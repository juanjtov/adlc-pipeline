# ADLC diff-scope check — the path-level half of author/verifier separation.
# Fails a PR whose changed files fall outside the scope allowed for its stage. Both decisions
# are unit-tested scripts (the check itself is shared with the local pre-commit hook):
#   .adlc/scripts/adlc-pr-stage.sh    WHICH stage — read from the PR's LINKED ISSUE, because the
#                                     lanes put stage:* on the issue and never on the PR. The
#                                     PR's own `lane:fast` / stage:* labels are the fallback.
#   .adlc/scripts/adlc-diff-scope.sh  THE check — design → docs/ only · build|fast →
#                                     .adlc/scope.txt · build+qa (issue at stage:qa) → that
#                                     scope + $ADLC_TEST_DIRS · no ADLC stage → skipped.
# A full-lane PR is held to .adlc/scope.txt only when the PR itself ships one; otherwise its
# scope is advisory here and enforced by the review.
name: ADLC diff-scope

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read          # the stage label is on the linked issue
  pull-requests: read

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enforce declared diff scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          # test dirs QA may write (regex alternation), e.g. tests|backend/tests
          ADLC_TEST_DIRS: "{{TEST_DIR_REGEX}}"
          # a scope file left on main by an earlier merged PR is not THIS PR's declared scope
          ADLC_SCOPE_IGNORE_INHERITED: "1"
        run: |
          chmod +x .adlc/scripts/adlc-pr-stage.sh .adlc/scripts/adlc-diff-scope.sh
          # Resolve the linked issue the same way adlc-review.yml's `route` job does. Plain
          # assignments (no pipe) so a failed API call fails the check instead of skipping it.
          pr_labels=$(gh pr view "$PR" --json labels --jq '.labels[].name')
          issue=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
          [ -z "$issue" ] && issue=$(gh pr view "$PR" --json body --jq '.body' | grep -oiE '#[0-9]+' | head -1 | tr -d '#' || true)
          issue_labels=""
          # A `#N` in the body may not be an issue here — then only the PR's own labels count.
          [ -n "$issue" ] && issue_labels=$(gh issue view "$issue" --json labels --jq '.labels[].name' || true)
          stage=$(.adlc/scripts/adlc-pr-stage.sh "$pr_labels" "$issue_labels")
          echo "stage=$stage (linked issue: #${issue:-none})"
          [ "$stage" = other ] && { echo "no ADLC stage — skipped"; exit 0; }
          files=$(gh pr diff "$PR" --name-only)
          printf '%s\n' "$files" | .adlc/scripts/adlc-diff-scope.sh "$stage"
