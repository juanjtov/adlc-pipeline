# ADLC fast lane — full-automation mode only.
# The short path for TRIVIAL, low-blast-radius changes: it skips the Architect/ADR and Gate 1,
# but keeps everything that makes a change safe — author/verifier separation (an independent
# adversarial + security review), a deterministic size/sensitivity cap, and the human MERGE gate
# (Gate 2). It never merges or deploys.
#
#   stage:fast ─▶ Builder makes the scoped change + a test, opens a PR (labelled lane:fast)
#              ─▶ cap re-checks the REAL diff; over-cap or sensitive ⇒ bounced to stage:design
#              ─▶ adversarial + security review; PASS ⇒ gate:deploy · CHANGES ⇒ fix loop
#
# HOW AN ISSUE REACHES stage:fast — the LANE IS ALWAYS HUMAN-APPROVED; the fast lane never
# auto-starts (not even under autopilot), because taking it skips design + Gate 1. Two ways, both
# a human applying the label — never the agent, never autopilot:
#   1. A human applies `stage:fast` directly (their own triage — cheapest; the Analyst never runs).
#   2. A human applies it to approve the Analyst's FAST recommendation at gate:stories.
# Under `adlc:autopilot`, a FAST recommendation PAUSES at gate:stories for that approval; autopilot
# auto-approves Gate 1 into the FULL pipeline only (see adlc-intake.yml).
#
# PREREQUISITES: identical to adlc-builder.yml — CLAUDE_CODE_OAUTH_TOKEN + ADLC_DISPATCH_TOKEN,
# the merge gate (PUBLIC → branch protection; PRIVATE → adlc-main-tripwire.yml), the author
# allowlist. This is a STARTING TEMPLATE — adapt commands/paths and the cap env to this repo.
# Both agent steps install the plugin and run as their named agent with that lane's tools —
# the review is read-only (see adlc-builder.yml, HOW THE AGENT RUNS).
name: ADLC fast lane

on:
  issues:
    types: [labeled]
  # `labeled` matters: the Builder opens the PR and adds `lane:fast` in a SECOND api call, so the
  # label is NOT in the `opened` payload — review_gate must also fire when the label lands.
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

# One review_gate run per PR at a time (opened+labeled can arrive together).
concurrency:
  group: adlc-fast-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ── Build the scoped change (no ADR — works from the Analyst's change brief on the issue) ──
  build:
    if: >
      github.event_name == 'issues' &&
      github.event.label.name == 'stage:fast' &&
      contains(fromJSON('["{{PRINCIPAL}}"]'), github.event.issue.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Builder (fast lane)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ADLC_DISPATCH_TOKEN }}   # PR authored by the bot; keeps author/verifier separation
          allowed_bots: "{{BUILDER_BOT}}"
          plugin_marketplaces: "https://github.com/juanjtov/adlc-pipeline.git"
          plugins: "adlc@adlc-pipeline"
          claude_args: |
            --agent adlc:builder
            --permission-mode dontAsk
            --allowedTools "Read,Edit,Write,Skill,Bash"
          prompt: |
            FAST LANE. Implement issue #${{ github.event.issue.number }} from its change brief —
            there is NO ADR. Load your role's skills plus adlc:triage with the Skill tool first.
            Write the declared scope to
            .adlc/scope/${{ github.event.issue.number }}.txt — one path prefix per line, covering
            every file you touch, the test included (the diff-scope check enforces it) — stay
            strictly within it, add at least one test carrying the brief's S1-AC1 id, and run the
            project's pass/fail command (paste the real summary). Open the PR with
            `gh pr create` targeting main, body starting `Closes #${{ github.event.issue.number }}`,
            and add the label `lane:fast`. Never merge. If the change turns out to need more than
            the brief's scope, STOP and comment that it should go to the full pipeline instead.

  # ── Cap + adversarial/security review + gate handoff (only for lane:fast PRs) ──
  review_gate:
    # Runs on a lane:fast PR. On a `labeled` event, only when the label added IS lane:fast —
    # so re-labeling the PR (e.g. adlc:changes-requested from the fix loop) doesn't re-fire it;
    # the fix loop's push re-fires it via `synchronize` instead.
    if: >
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'lane:fast') &&
      (github.event.action != 'labeled' || github.event.label.name == 'lane:fast') &&
      contains(fromJSON('["{{PRINCIPAL}}","{{BUILDER_BOT}}"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ADLC_DISPATCH_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the cap needs the base branch and this PR's merge base

      - name: Resolve the linked issue
        id: link
        run: |
          issue=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
          [ -z "$issue" ] && issue=$(gh pr view "$PR" --json body --jq '.body' | grep -oiE '#[0-9]+' | head -1 | tr -d '#')
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

      # Re-check the real diff. Over-cap or sensitive ⇒ full pipeline. A diff it cannot measure ⇒
      # the step fails, nothing moves, and the next step says so. This step ROUTES; it runs from
      # the PR's own checkout, so the verdict a PR cannot edit is the same cap in
      # adlc-diff-scope.yml, which runs from the default branch.
      - name: Fast-lane cap (real diff)
        id: cap
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A self-hosted runner keeps /tmp between jobs: a stop reason an earlier job left must
          # not be posted as this PR's if this step dies before it writes its own.
          rm -f /tmp/cap.fail
          chmod +x .adlc/scripts/adlc-triage.sh
          # Plain assignments, never a pipe from git: this shell has no pipefail, and the script
          # answers FAST when it is given nothing — a diff that cannot be taken must fail the
          # step, not pass as a small change. The full ref name: a tag called `origin/<base>`
          # must not stand in for the base branch.
          stop() { echo "::error::Fast-lane cap: $1"; echo "$1" > /tmp/cap.fail; exit 1; }
          base=$(git merge-base "refs/remotes/origin/$BASE_REF" HEAD) || stop "could not find where this PR branches from $BASE_REF"
          # --no-renames: a rename would show as `old => new` with 0 lines, hiding both the
          # sensitive path it moved to and its size. --ignore-submodules=none: the PR's own
          # .gitmodules (`ignore = all`) must not hide a submodule change. core.quotePath=false:
          # git would otherwise quote a path with a non-ASCII byte ("auth/caf\303\251.py"), and
          # the quotes hide it from the denylist.
          numstat=$(git -c core.quotePath=false diff --numstat --no-renames --ignore-submodules=none "$base" HEAD) || stop "could not read the diff against $BASE_REF"
          # Nor is an empty diff a small change: either the PR changes nothing, or this step is
          # not looking at the PR (a checkout of the base branch, say). Stop, as for a failed read.
          [ -n "$numstat" ] || stop "the diff against $BASE_REF is empty — nothing to measure"
          if printf '%s\n' "$numstat" | .adlc/scripts/adlc-triage.sh > /tmp/cap.out 2> /tmp/cap.err; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      # Only when the cap step itself failed (not when an earlier step did): a red run in the
      # Actions tab is easy to miss, and the PR would otherwise wait at lane:fast with no word.
      - name: Say that the cap could not run
        if: failure() && steps.cap.outcome == 'failure'
        run: |
          reason=$(cat /tmp/cap.fail 2>/dev/null || true)
          gh pr comment "$PR" --body "⚠️ The fast-lane cap could not measure this PR${reason:+: $reason}. Nothing changed: the PR keeps \`lane:fast\`, the issue's labels are as they were, and no review ran. Fix the cause and push again, or re-run the failed job: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Bounce to the full pipeline (cap exceeded)
        if: steps.cap.outputs.eligible == 'false'
        run: |
          reason=$(cat /tmp/cap.err || echo "exceeds the fast-lane cap")
          gh pr comment "$PR" --body "⏫ This change $reason — routing to the **full pipeline** for real design. The design lane writes an ADR + task breakdown, and the Builder then opens a new PR from the design branch; this PR stays open as its reference — close it once the new one is up."
          gh pr edit "$PR" --remove-label lane:fast || true
          if [ -n "${{ steps.link.outputs.issue }}" ]; then
            gh issue edit "${{ steps.link.outputs.issue }}" --remove-label stage:fast --add-label stage:design || true
          fi

      - name: Adversarial + security review
        if: steps.cap.outputs.eligible == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.ADLC_DISPATCH_TOKEN }}
          allowed_bots: "{{BUILDER_BOT}}"
          plugin_marketplaces: "https://github.com/juanjtov/adlc-pipeline.git"
          plugins: "adlc@adlc-pipeline"
          claude_args: |
            --agent adlc:adversarial-reviewer
            --permission-mode dontAsk
            --allowedTools "Skill,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr list:*),Bash(gh pr checks:*),Bash(gh issue view:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          prompt: |
            FAST-LANE PR #${{ github.event.pull_request.number }}. Review in fresh context,
            read-only, seeing ONLY the diff + the issue's change brief (there is no ADR — do not
            ask for one). Load your role's skills with the Skill tool first. Apply the three pillars,
            walking every security-gate attack class against the diff. Post findings as ONE PR
            comment whose LAST line is exactly `ADLC-ADV: PASS` (nothing blocking) or
            `ADLC-ADV: CHANGES` (a confirmed Critical/High). Never edit code, never merge, never
            change labels — the next step does.

      - name: Advance to Gate 2 or hand to the fix loop
        if: steps.cap.outputs.eligible == 'true'
        run: |
          chmod +x .adlc/scripts/adlc-verdict.sh
          adv=$(gh pr view "$PR" --json comments --jq '.comments[].body' | .adlc/scripts/adlc-verdict.sh ADLC-ADV)
          echo "adversarial=$adv"
          if [ "$adv" = "PASS" ]; then
            gh pr edit "$PR" --remove-label "adlc:changes-requested" 2>/dev/null || true
            if [ -n "${{ steps.link.outputs.issue }}" ]; then
              gh issue edit "${{ steps.link.outputs.issue }}" --remove-label stage:fast --add-label gate:deploy || true
            fi
            gh pr comment "$PR" --body $'## Proposed Action Card — Gate 2 (fast lane)\nAction:     merge PR #'"$PR"$' to main\nRisk:       low — trivial change, within the fast-lane cap (the ADLC diff-scope check on this PR confirms it from the default branch), adversarial + security review PASS\nEvidence:   see the review comment (PASS) and the CI checks on this PR\nMigrations: none (a migration would have forced the full pipeline)\nRollback:   revert the merge commit\nAwaiting:   Principal approval'
          else
            gh pr edit "$PR" --add-label "adlc:changes-requested" || true
            echo "Adversarial review requested changes → fix loop runs (adlc-fix.yml)."
          fi
