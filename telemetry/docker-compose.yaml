# Run the ADLC telemetry collector locally:  docker compose up -d   (from this telemetry/ dir)
# One collector serves every repo — they all export to localhost:4317. Stop with: docker compose down.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0   # adjust to a current release if this tag 404s
    container_name: adlc-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
      - ./data:/data                # telemetry.jsonl is written here
    ports:
      - "4317:4317"   # OTLP gRPC — the endpoint settings.telemetry.json points at
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus scrape endpoint (optional)
    restart: unless-stopped
