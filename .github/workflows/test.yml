# The plugin's own CI: runs the guardrail unit tests on every push/PR so the deterministic
# guardrails (diff-scope, tripwire, fix-cap, verdict, doctor) can't regress.
name: test

on: [push, pull_request]

jobs:
  guardrail-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guardrail tests
        run: bash tests/run.sh
      - name: Run Mission Control tests
        run: python3 -m unittest discover -s mission-control/tests
      # Mission Control promises to run on the Python that ships with the macOS developer tools.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Run Mission Control tests on Python 3.9
        run: python3 -m unittest discover -s mission-control/tests
